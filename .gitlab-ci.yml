default:
  image: docker:latest
  services:
    - name: docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  GIT_SUBMODULE_STRATEGY: normal
  FF_NETWORK_PER_BUILD: "true"

stages:
  # - build
  # - test
  - release

.tag_rules:
  rules:
    - if: $CI_COMMIT_TAG

.commit_rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

