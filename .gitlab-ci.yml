bin:build:
  stage: release
  image: debian:13
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt update -y
    - apt install -y python3 python3-pip pipx
    - pipx install uv
  script:
    - mkdir bin
    - cd cli
    - echo "building for Debian 13 Trixie"
    - /root/.local/bin/uv sync --locked --group dev
    - /root/.local/bin/uv run pyinstaller -F src/bqat/cli.py -n ${LINUX_BIN}
    - mv dist/${LINUX_BIN} ../bin
  cache:
    key:
      files:
      - uv.lock
  artifacts:
    paths:
    - bin/
  rules:
    - !reference [.commit_rules, rules]
    - !reference [.tag_rules, rules]

bin:upload:
  stage: release
  needs:
    - job: bin:build
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "upload debian exe binary files to package registry"
    - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file bin/${LINUX_BIN_DEB} "${PACKAGE_REGISTRY_URL}/${LINUX_BIN_DEB}"'
  rules:
    - !reference [.commit_rules, rules]
    - !reference [.tag_rules, rules]

pypi:
  stage: release
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  variables:
    TWINE_USERNAME: gitlab-ci-token
    TWINE_PASSWORD: $CI_JOB_TOKEN
  script:
    - cd cli
    - uv build --wheel
    - uvx twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  rules:
    - !reference [.commit_rules, rules]
    - !reference [.tag_rules, rules]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: pypi
    - job: bin:upload
  script:
    - echo "releasing with new version tag"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: '$CI_COMMIT_TAG'
    assets:
      links:
      - name: "Python Wheel"
        url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi/'
      - name: "Binary Executable"
        url: '${PACKAGE_REGISTRY_URL}/${LINUX_BIN}'
  rules:
    - !reference [.commit_rules, rules]
    - !reference [.tag_rules, rules]