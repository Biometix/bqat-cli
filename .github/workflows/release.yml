name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container:
    name: Rebuild and Release Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Check out Repository
        uses: actions/checkout@v5
        with:
          submodules: 'true'
      - 
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - 
        name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - 
        name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  wheel:
    name: Rebuild and Release Wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v5
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
          python-version: '3.14'
      - name: 🛠️ Build Source Distribution and Wheel
        run: |
          uv build
      - name: 📦 Publish to GitHub Packages
        run: |
          # Use curl or a dedicated action to upload the packages.
          # The curl command below uploads all files in 'dist/' as a release asset.
          # For a true GitHub Package Registry upload, using the 'gh' CLI or a specific action is better.
          # However, publishing a Python package to the GitHub Packages **PyPI-like registry**
          # is typically done with a tool like 'twine' or 'uv publish' to a URL like:
          # https://github.com/<OWNER>/<REPO>/packages/pypi/<PACKAGE_NAME>
          
          # For a generic file upload to the release itself (which is often what people mean by "publishing a wheel"), 
          # we rely on the 'softprops/action-gh-release' step later to attach them as assets. 
          # The 'gh release upload' command can also be used here if you prefer to upload as a package, 
          # but the `softprops` action is cleaner for release assets.
          
          # We'll use the pypa/gh-action-pypi-publish action's logic but target GitHub Packages.
          # Note: The PyPI action is primarily for PyPI, but its logic for distributing packages is useful.
          # Since uv doesn't have a direct 'publish to GPR' command, we stick to building and uploading as assets.
          echo "Build successful. Artifacts are in dist/"
      - name: 🚀 Upload Release Assets (Wheels/sdist)
        # This uploads the generated files from 'dist/' as assets to the new GitHub Release.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
