name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container:
    name: Build and Release Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Check out Repository
        uses: actions/checkout@v5
        with:
          submodules: 'true'
      - 
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - 
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - 
        name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Get tags from submodules
        id: tags
        run: |
          git fetch --tags --depth=1
          CLI_VER=$(git describe --tags --abbrev=0)
          echo $CLI_VER
          echo "cli_ver=${CLI_VER#v}" >> $GITHUB_OUTPUT
          cd bqat/core/bqat_core/
          git fetch --tags --depth=1
          CORE_VER=$(git describe --tags --abbrev=0)
          echo $CORE_VER
          echo "core_ver=${CORE_VER#v}" >> $GITHUB_OUTPUT
      -
        name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }},
            bqat.core.version=${{ steps.tags.outputs.core_ver }},
            bqat.cli.version=${{ steps.tags.outputs.cli_ver }}
  bin:
    name: Build and Release Wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v5
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          python-version: '3.14'
      - name: 🛠️ Build Wheel and Binary EXE
        run: |
          cd cli
          uv build --wheel
          uv sync --locked --group dev
          uv run pyinstaller -F src/bqat/cli.py -n bqat
      - name: 🚀 Upload Release Assets (Wheels/EXE)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/dist/*.whl
            cli/dist/bqat
