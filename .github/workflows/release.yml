  wheel:
    name: Rebuild and Release Wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v5
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
          python-version: '3.14'
      - name: 🛠️ Build Source Distribution and Wheel
        run: |
          cd cli
          uv build
      - name: 🚀 Upload Release Assets (Wheels/sdist)
        # This uploads the generated files from 'dist/' as assets to the new GitHub Release.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/dist/*
