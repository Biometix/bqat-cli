name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Hygiene: Clear old caches to stay under the 10GB limit
  cleanup:
    name: Cleanup Old Caches
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old Docker caches
        run: |
          gh cache delete --all --repo ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Build: Parallel native builds for each architecture
  build:
    name: Build Architecture
    needs: cleanup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out Repository
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"          

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 3. Merge: Combine digests into a single multi-platform tag
  merge:
    name: Merge and Tag
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Check out Repository
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Get tags from submodules
        id: tags
        run: |
          git fetch --tags --depth=1
          CLI_VER=$(git describe --tags --abbrev=0)
          echo "cli_ver=${CLI_VER#v}" >> $GITHUB_OUTPUT
          cd bqat/core/bqat_core/
          git fetch --tags --depth=1
          CORE_VER=$(git describe --tags --abbrev=0)
          echo "core_ver=${CORE_VER#v}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:bqat.core.version=${{ steps.tags.outputs.core_ver }}" \
            --annotation "index:bqat.cli.version=${{ steps.tags.outputs.cli_ver }}" \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

  bin:
    name: Build and Release Wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v6
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.27"
          python-version: '3.14'
      - name: 🛠️ Build Wheel and Binary EXE
        run: |
          cd cli
          uv build --wheel
          uv sync --locked --group dev
          uv run pyinstaller -F src/bqat/cli.py -n bqat
      - name: 🚀 Upload Release Assets (Wheels/EXE)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/dist/*.whl
            cli/dist/bqat
